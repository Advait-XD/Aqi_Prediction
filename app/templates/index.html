<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AQI Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 40px;
            background: #f8f9fa;
            text-align: center;
        }
        .form-container {
            margin-bottom: 30px;
        }
        select, button {
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .charts {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }
        canvas {
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }
        .aqi-result {
            margin-top: 20px;
            font-size: 18px;
            background: #fff3cd;
            padding: 15px;
            border: 1px solid #ffeeba;
            border-radius: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Air Quality Index Dashboard</h1>

    <form method="POST" class="form-container">
        <select name="city" required>
            <option value="" disabled selected>Select a city</option>
            {% for city in cities %}
                <option value="{{ city }}" {% if city == selected_city %}selected{% endif %}>{{ city }}</option>
            {% endfor %}
        </select>
        <button type="submit">Show Data</button>
        {% if selected_city %}
        <button type="submit" name="predict" value="true" style="background-color: green;">Predict AQI</button>
        {% endif %}
    </form>

    {% if predicted_aqi %}
        <div class="aqi-result">
            <strong>Predicted AQI:</strong> {{ predicted_aqi }}<br>
            <strong>Bucket:</strong> {{ aqi_bucket }}
        </div>
    {% endif %}

    {% if aqi_data %}
    <div class="charts">
        <div style="width: 600px;">
            <h3>AQI Over Time</h3>
            <canvas id="aqiChart"></canvas>
        </div>

        {% if avg_pollutants %}
        <div style="width: 600px;">
            <h3>Average Pollutant Levels</h3>
            <canvas id="pollutantChart"></canvas>
        </div>
        {% endif %}
    </div>
    {% endif %}

    <script>
        {% if aqi_data %}
        const aqiCtx = document.getElementById('aqiChart').getContext('2d');
        const aqiChart = new Chart(aqiCtx, {
            type: 'line',
            data: {
                labels: {{ aqi_data | map(attribute='Date') | list | tojson }},
                datasets: [{
                    label: 'AQI',
                    data: {{ aqi_data | map(attribute='AQI') | list | tojson }},
                    borderColor: 'blue',
                    fill: false,
                    tension: 0.3
                }]
            }
        });
        {% endif %}

        {% if avg_pollutants %}
        const pollutantCtx = document.getElementById('pollutantChart').getContext('2d');
        const pollutantChart = new Chart(pollutantCtx, {
            type: 'bar',
            data: {
                labels: {{ avg_pollutants.keys() | list | tojson }},
                datasets: [{
                    label: 'Avg Pollutant Level',
                    data: {{ avg_pollutants.values() | list | tojson }},
                    backgroundColor: 'rgba(255, 99, 132, 0.7)'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        {% endif %}
    </script>
</body>
</html>
