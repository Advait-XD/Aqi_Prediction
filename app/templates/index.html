<!DOCTYPE html>
<html>
<head>
    <title>AQI Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
            color: #333;
        }
    
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
    
        form {
            margin-bottom: 30px;
        }
    
        select, button {
            padding: 8px 12px;
            margin-right: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
    
        button:hover {
            background-color: #2980b9;
        }
    
        canvas {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
    
</head>
<body>
    <h1>AQI Predictor</h1>

    <form method="POST">
        <label for="city">Select a city:</label>
        <select name="city" id="city">
            {% for city in cities %}
                <option value="{{ city }}" {% if city == selected_city %}selected{% endif %}>{{ city }}</option>
            {% endfor %}
        </select>
        <button type="submit">Show AQI</button>
    </form>

    {% if selected_city %}
        <h2>Showing AQI for: {{ selected_city }}</h2>
        <canvas id="aqiChart" width="800" height="400"></canvas>
    {% endif %}

    {% if aqi_data %}
    <script>
        const aqiData = {{ aqi_data | tojson | safe }};
        const labels = aqiData.map(d => d.Date);
        const values = aqiData.map(d => d.AQI);

        const ctx = document.getElementById("aqiChart").getContext("2d");
        new Chart(ctx, {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "AQI Over Time",
                    data: values,
                    borderColor: "rgba(75, 192, 192, 1)",
                    borderWidth: 2
                }]
            },
            options: {
                responsive : true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
    {% endif %}
</body>
</html>
